<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="icon" type="image/png" href="{{url_for('static', filename='web_favicon.png') }}">
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .page-body {
            background-image: url("{{url_for('static', filename='back.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 95vh;
            font-weight: 600;
            margin: 0;
        }

        .order-form {
            margin-top: 10px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 35%;
            /* Galti yahan thi: height 85% se form lamba ho raha tha, ab auto hai */
            height: auto; 
            border: rgba(255, 255, 255, 0.3);
            padding: 20px; /* Padding thodi adjust ki hai taaki elements achhe se dikhein */
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #ffffff62;
            box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
            backdrop-filter: blur(13px);
            flex-shrink: 0;
        }

        .form-label {
            margin-top: 5px;
        }

        .sub {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sub:hover {
            background-color: #45a049;
        }

        .sub:active {
            background-color: #2b23c5cd;
        }

        .form-input {
            width: 70%;
            margin: 10px;
            padding: 12px;
            box-sizing: border-box;
            border: 1.8px solid #b8b0b06a;
            border-radius: 5px;
            transition: 0.4s;
            outline: none;
        }

        .form-input:focus {
            border-color: green;
            box-shadow: 0 0 5px rgba(23, 12, 236, 0.605);
        }

        .result {
            height: 50px;
            width: 30%;
            /* Naya Concept: visibility hidden space reserve karta hai */
            display: flex;
            visibility: hidden; 
            border: 2px solid rgb(25, 11, 222);
            margin-top: 15px;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            padding: 0;
            background-color: #ffffffb3;
        }

        #result_text {
            margin: 3px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* Responsive design for smaller screens */
        @media screen and (max-width: 768px) {
            .order-form {
                width: 85%;
                padding: 15px; /* Mobile ke liye padding theek ki */
                height: auto; /* Yahan bhi height auto kar di */
                backdrop-filter: blur(12px);
            }

            .page-body {
                font-size: 14px;
                background-image: url("{{url_for('static', filename='back.png') }}");
                background-size: cover;
            }

            .form-input {
                width: 90%;
                padding: 10px;
            }

            .sub {
                padding: 8px 16px;
            }

            .result {
                font-size: 16px;
                font-weight: 600;
                width: 90%;
                padding: 0px;
                margin-top: 20px;
                border: 1px solid blue;
                backdrop-filter: blur(20px);
                /* Mobile ke liye bhi same fix */
                display: flex;
                visibility: hidden;
            }

            #hed {
                font-size: 15px;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body class="page-body">

    <h2 id="hed"
        style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; color: #006666; text-align: center; margin-top: 20px; font-size: 30px;">
        <u>RTO Fraud Detector</u>
    </h2>

    <form id="predictionForm" class="order-form">

        <label class="form-label">Mobile OTP Verification</label>
        <select name="Is_Verified_Mobile" required class="form-input">
            <option value="" selected>Select Verification Status</option>
            <option value="True">Yes (Verified)</option>
            <option value="False">No (Not Verified)</option>
        </select>

        <label class="form-label" for="item4">Mobile No.</label>
        <input type="tel" maxlength="10" pattern="[0-9]{10}" id="item4" name="mobile_no" class="form-input"
            placeholder="Enter Mobile No." title="Please enter 10 digit mobile no." required>

        <label class="form-label" for="item2">Payment Type</label>
        <select type="Payment_Type" id="item2" name="Payment_Type" class="form-input" required>
            <option value="" selected>Select Payment Type</option>
            <option value="COD">COD</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="UPI">UPI</option>
            <option value="Net Banking">Net Banking</option>
        </select>

        <label class="form-label" for="item3">Cancellation History</label>
        <input type="number" id="item3" name="Return_Count" class="form-input" placeholder="How many orders returned yet"
            required>

        <label class="form-label" for="item5">Order Amount</label>
        <input type="number" id="item5" name="Order_Value" class="form-input" placeholder="Enter Order Amount" required>

        <label class="form-label" for="city">City</label>
        <select type="City" name="City_Tier" class="form-input" required>
            <option value="" selected>Select City Type</option>
            <option value="Metro City">Metro City</option>
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
        </select>

        <input type="submit" value="Submit" class="sub">

    </form>

    <div class="result" id="rslt">
        <p id="result_text"></p>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var formData = new FormData(this);
            
            const rslt = document.getElementById('rslt');
            // JavaScript fix: Ab form layout shift nahi hoga, bas box visible ho jayega
            rslt.style.visibility = "visible";
            rslt.style.opacity = "1";

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                let resultPara = document.getElementById('result_text');
                resultPara.style.opacity = 0;
                
                setTimeout(() => {
                    resultPara.textContent = data.prediction_text;
                    resultPara.style.opacity = 1;
                }, 300);
                
                document.getElementById('predictionForm').reset();
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Server se connect hone mein error aaya hai. Console check karein.");
            });
        });
    </script>
</body>

</html>
